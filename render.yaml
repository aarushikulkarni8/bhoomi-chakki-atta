# Render Blueprint: https://render.com/docs/blueprint-spec
# Values marked "sync: false" are typed into the Render dashboard and never stored in this repository.
services:
  - type: web
    name: bhoomi-chakki-atta
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_PHONE # 10 digits without +91; visible to visitors of the site
        sync: false
    routes:
      # Lets page addresses such as /about open directly.
      - type: rewrite
        source: /*
        destination: /index.html
